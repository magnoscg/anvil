name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go Tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify downloaded modules
        run: go mod verify

      - name: Run Go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Run Go tests with the race detector
        run: go test -race ./...

      - name: Run integration tests
        run: make test-integration

      - name: Validate skill provenance and Swift examples
        run: ./scripts/validate-skill-content.sh

      - name: Validate public social preview
        run: make validate-public-assets

  swift-tests:
    name: Swift Tests (Example)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A hardcoded device name silently rots when the runner image moves to a
      # new iPhone generation, so resolve whatever the image actually ships.
      # Runtimes are compared numerically: as text, iOS-26-10 sorts below iOS-26-5.
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-[0-9]+(-[0-9]+)*$")))
            | map({
                version: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)),
                iphones: (.value | map(select(.name | startswith("iPhone"))))
              })
            | map(select(.iphones | length > 0))
            | sort_by(.version)
            | last
            | .iphones[0].udid // empty
          ')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator on this runner" >&2
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build Example project
        run: |
          xcodebuild build \
            -project Example/Arquitectura.xcodeproj \
            -scheme Arquitectura-Dev \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -quiet

      - name: Run Swift tests
        run: |
          xcodebuild test \
            -project Example/Arquitectura.xcodeproj \
            -scheme Arquitectura-Dev \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -quiet

  vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Only darwin binaries ship, so analyse darwin code paths. govulncheck is
      # installed for the host first; GOOS applies to the analysis alone.
      - name: Scan reachable Go code
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOOS=darwin "$(go env GOPATH)/bin/govulncheck" ./...

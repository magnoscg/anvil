name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go Tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify downloaded modules
        run: go mod verify

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: make test

      - name: Validate skill provenance and Swift examples
        run: ./scripts/validate-skill-content.sh

      - name: Validate public social preview
        run: make validate-public-assets

  swift-tests:
    name: Swift Tests (Example)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A hardcoded device name silently rots when the runner image moves to a
      # new iPhone generation, so resolve whatever the image actually ships.
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("SimRuntime.iOS")))
            | sort_by(.key)
            | reverse
            | .[0].value
            | map(select(.name | startswith("iPhone")))
            | .[0].udid
          ')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator on this runner" >&2
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build Example project
        run: |
          xcodebuild build \
            -project Example/Arquitectura.xcodeproj \
            -scheme Arquitectura-Dev \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -quiet

      - name: Run Swift tests
        run: |
          xcodebuild test \
            -project Example/Arquitectura.xcodeproj \
            -scheme Arquitectura-Dev \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -quiet

  vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Scan reachable Go code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

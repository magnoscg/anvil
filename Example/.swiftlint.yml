# .swiftlint.yml
# SwiftLint configuration for Arquitectura project
# Aligned with Clean Architecture + MVVM patterns

# MARK: - Opt-in Rules

opt_in_rules:
  - closure_body_length
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - fatal_error_message
  - file_name_no_space
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_random
  - modifier_order
  - overridden_super_call
  - private_outlet
  - private_action
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# MARK: - Disabled Rules

disabled_rules:
  - line_length
  - trailing_comma
  - identifier_name
  - type_name
  - large_tuple
  - nesting

# MARK: - Exclusions

excluded:
  - DerivedData
  - .build
  - Pods
  - .swiftpm

# MARK: - Rule Configuration

file_length:
  warning: 400
  error: 500

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 40
  error: 60

cyclomatic_complexity:
  warning: 10
  error: 15
